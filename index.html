<style>
:root{
  --plum:#7A6C7F;--plumD:#544858;--plumT:#E6E0E8;
  --lilac:#B4AABD;--lilacD:#5B5068;--lilacT:#ECE8EF;
  --green:#677166;--greenD:#4B5449;--greenT:#DDE3D8;
  --sage:#B3BEAE;--sageD:#3F4A3D;
  --apri:#D8C0B4;--apriT:#F1E6DF;--apriD:#7A5643;
  --bg:#E5E2DC;--line:#D9D5CE;--tx:#26252E;--gr:#5F5E66;--anth:#4A4A50;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;padding:16px 16px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.top{padding:calc(22px + env(safe-area-inset-top)) 20px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top .date{font-size:13px;color:var(--gr);font-weight:600}
h1{margin:2px 0 0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{margin:0;font-size:15px;font-weight:800}
.hero{padding:calc(22px + env(safe-area-inset-top)) 20px 18px;border-radius:0 0 28px 28px;color:#fff;display:flex;flex-direction:column;gap:14px;background:var(--green)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.18);border-radius:14px;padding:4px;gap:3px}
.seg button{border:0;background:transparent;color:#fff;border-radius:10px;min-height:40px;font-size:12px;font-weight:600;padding:0 2px}
.seg button.on{background:#fff;color:var(--greenD);font-weight:800}
.seg.light{background:var(--bg)}
.seg.light button{color:var(--gr)}
.seg.light button.on{color:var(--tx)}
.card{background:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.flat{gap:0;padding:4px 16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.row{display:flex;align-items:center;gap:10px;min-height:48px}
.card.flat .row+.row{border-top:1px solid #EEECE8}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.name{font-size:14px;font-weight:700}
.muted{color:var(--gr);font-size:12px}
.qty{font-size:14px;font-weight:800;color:var(--greenD);white-space:nowrap}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 16px;font-weight:800;font-size:14px;background:var(--green);color:#fff}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;min-height:36px;padding:0 12px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.tag{font-size:11px;font-weight:700;border-radius:7px;padding:2px 7px;background:var(--greenT);color:var(--sageD);white-space:nowrap}
.tag.apri{background:var(--apriT);color:var(--apriD)}
.tag.lilac{background:var(--lilacT);color:var(--lilacD)}

.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--gr)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px;color:var(--tx)}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);flex:0 0 22px;margin:0}

.sq{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:22px;font-weight:700}

.nav button.soon{opacity:.4}
.nav .bar{width:18px;height:3px;border-radius:2px;background:transparent}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.dayc{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;padding:6px 2px;border:2px solid transparent;background:none;min-width:0}

.dayc .wd{font-size:11px;font-weight:700;color:var(--gr)}

.pill.inl{display:inline-block;width:auto;padding:3px 8px}
.tile{border:0;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:120px}
.tile .lbl{font-size:12px;font-weight:700}
.tile .big{font-size:18px;font-weight:800;line-height:1.25}
.hint{background:var(--apriT);border:1.5px solid var(--apri);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;color:var(--apriD);font-size:13px}

.bar8{height:8px;border-radius:4px;background:rgba(255,255,255,.28);display:flex;overflow:hidden}
.bar8 span{background:#fff;border-radius:4px}
.step{display:flex;gap:12px;align-items:center;min-height:52px;border:0;background:none;text-align:left;width:100%;padding:0}
.step+.step{border-top:1px solid #EEECE8}
.dot{width:30px;height:30px;border-radius:15px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid var(--line);color:var(--gr)}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.dot.now{background:var(--tx);border-color:var(--tx);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rcard{background:#fff;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;color:var(--tx)}
.rcard .nm{font-size:14px;font-weight:800;line-height:1.2;padding:0 4px}
.rcard .tags{padding:0 4px 4px}
.ph{border-radius:14px;width:100%;aspect-ratio:4/3;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--sage),var(--apri));color:#fff;font-size:30px;font-weight:800}
.photo{position:relative}
.photo .ph{border-radius:0 0 28px 28px;aspect-ratio:auto;height:calc(250px + env(safe-area-inset-top))}
.round{position:absolute;top:calc(16px + env(safe-area-inset-top));width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.92);border:0;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.stepper button{width:36px;height:36px;border:0;border-radius:10px;background:#fff;font-size:18px;font-weight:800}
.stepper span{font-size:13px;font-weight:800;padding:0 6px;white-space:nowrap}
.amt{width:84px;flex:0 0 84px;font-size:13px;font-weight:800;color:var(--greenD)}
.ingrow{display:grid;grid-template-columns:70px 84px 1fr 36px;gap:6px;align-items:center}
.ingrow input{min-height:42px;padding:0 8px;font-size:15px}
.switch{width:46px;height:28px;border-radius:14px;border:0;background:var(--line);padding:3px;display:flex;flex:0 0 46px}
.switch span{width:22px;height:22px;border-radius:11px;background:#fff;display:block;transition:transform .15s}
.switch.on{background:var(--green)}
.switch.on span{transform:translateX(18px)}
.faded{opacity:.45}
.sheet-bg{position:fixed;inset:0;background:rgba(38,37,46,.38);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:14px;max-width:420px;margin:0 auto;width:100%}
.logo{width:64px;height:64px;border-radius:20px;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.err{color:#9A3E31;font-size:13px;font-weight:700}
.empty{color:var(--gr);font-size:13px;padding:6px 0}
.center{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--gr);font-weight:700}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"><div class="center">Brain lädt …</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, writeBatch, deleteField, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBB7bXR_fB0pfxdAVYVfjTx5dIEF-OtNEY",
  authDomain: "brain-c7223.firebaseapp.com",
  projectId: "brain-c7223",
  storageBucket: "brain-c7223.firebasestorage.app",
  messagingSenderId: "1097973540663",
  appId: "1:1097973540663:web:b97982d20200ed5833dcb2"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
let db;
try { db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = initializeFirestore(fb, {}); }

const HOME = "homes/brain";
const C = n => collection(db, `${HOME}/${n}`);
const D = (n, id) => doc(db, `${HOME}/${n}/${id}`);
const SETTINGS = () => doc(db, `${HOME}/meta/settings`);

/* ---------- Zustand ---------- */
const S = {
  user: null, settings: undefined,
  tab: "start", ktab: "woche",
  recipes: [], basics: [], pantry: [], shopping: [], leftovers: [], plan: {}, days: {},
  events: [], bookings: [], money: [], members: {}, todos: [], fin: [], privMeta: null, privLoaded: false,
  ui: { q: "", tag: "Alle", recipeId: null, portions: null, form: null, sheet: null, planMode: null, f: {}, toast: "", loginErr: "", busy: false, mf: { type: "out" }, geldMode: "gemeinsam", calc: null, act: Date.now() }
};
const STORES = { super: "Supermarkt", edeka: "Edeka", rossmann: "Rossmann", online: "Online" };
const STORE_ORDER = ["super", "edeka", "rossmann", "online"];

/* ---------- Hilfen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const K = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const P = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const add = (k, n) => { const d = P(k); d.setDate(d.getDate() + n); return K(d); };
const diff = (a, b) => Math.round((P(b) - P(a)) / 864e5);
const today = () => K(new Date());
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const WDL = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const dow = k => P(k).getDay();
const short = k => `${WD[dow(k)]} ${P(k).getDate()}.${pad(P(k).getMonth() + 1)}.`;
const longDate = k => `${WDL[dow(k)]}, ${P(k).getDate()}. ${MON[P(k).getMonth()]}`;
const fmt = n => { const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : String(r).replace(".", ","); };
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(/\s/g, "").replace(/[−–]/g, "-").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const lc = s => String(s || "").toLowerCase();
const firstName = () => { const e = S.user?.email || ""; const p = e.split("@")[0].split(/[._-]/)[0]; return p ? p[0].toUpperCase() + p.slice(1) : ""; };

/* ---------- Rhythmus: Gym, Gym, frei ---------- */
let RC = null, SC = null;
function rhythm() {
  if (RC) return RC;
  const st = S.settings || {}; const res = {};
  if (!st.anchor) return (RC = res);
  const until = add(today(), 75);
  let pos = Number(st.anchorPos) || 0, k = st.anchor;
  while (k <= until) {
    const d = S.days[k] || {};
    if (d.force === "gym") { const n = pos < 2 ? pos + 1 : 1; res[k] = { s: "gym", n }; pos = n; }
    else if (d.force === "free") { res[k] = { s: "free" }; pos = 0; }
    else if (pos < 2 && (d.early || evEarly(k))) { res[k] = { s: "free", moved: true }; pos = 0; }
    else if (pos < 2) { res[k] = { s: "gym", n: pos + 1 }; pos = pos + 1; }
    else { res[k] = { s: "free" }; pos = 0; }
    k = add(k, 1);
  }
  return (RC = res);
}
/* ---------- Einkaufstage: einmal pro Woche ---------- */
function shopChain() {
  if (SC) return SC;
  const st = S.settings || {}; const R = rhythm(); const out = [];
  if (!st.firstShop) return (SC = out);
  const forced = new Set(Object.keys(S.days).filter(k => S.days[k]?.shop === true));
  forced.add(st.firstShop);
  const from = add(today(), -14);
  const starts = [...forced].filter(k => k >= from).sort();
  let cur = starts[0] || st.firstShop; out.push(cur);
  const until = add(today(), 45);
  while (cur < until) {
    let next = null;
    for (let i = 1; i <= 10; i++) { const k = add(cur, i); if (forced.has(k)) { next = k; break; } }
    if (!next) {
      let best = null, bs = 1e9;
      for (let i = 4; i <= 10; i++) {
        const k = add(cur, i); const d = S.days[k] || {}; const r = R[k];
        if (!r || r.s !== "free" || dow(k) === 0 || d.noCar || evCar(k) || d.shop === false) continue;
        const sc = Math.abs(i - 7) + (dow(k) === 6 ? 3 : 0);
        if (sc < bs) { bs = sc; best = k; }
      }
      next = best || add(cur, 7);
    }
    out.push(next); cur = next;
  }
  return (SC = out);
}
function shopInfo(fromK) {
  const ch = shopChain();
  const i = ch.findIndex(k => k >= fromK);
  if (i < 0) return null;
  const s = ch[i], nxt = ch[i + 1] || add(s, 7);
  return { s, nxt, n: diff(s, nxt) };
}
const isShop = k => shopChain().includes(k);
function dayKind(k) { if (isShop(k)) return "shop"; const r = rhythm()[k]; return r ? r.s : null; }
function pill(k) {
  const t = dayKind(k);
  if (t === "shop") return `<span class="pill shop">Einkauf</span>`;
  if (t === "gym") return `<span class="pill gym">Gym</span>`;
  if (t === "free") return `<span class="pill free">Frei</span>`;
  return `<span class="pill free">–</span>`;
}

/* ---------- Basics ---------- */
function bTotal(b, n) {
  const a = Number(b.amount) || 0;
  if (b.rule === "day") return a * n;
  if (b.rule === "week") return a * n / 7;
  if (b.rule === "lasts") return a > 0 ? n / a : 0;
  return a;
}
const PL = { "Dose": "Dosen", "Flasche": "Flaschen", "Packung": "Packungen", "Tüte": "Tüten", "Schale": "Schalen", "Glas": "Gläser", "Scheibe": "Scheiben", "Becher": "Becher", "Stück": "Stück", "Handvoll": "Handvoll", "Netz": "Netze", "Beutel": "Beutel", "Tube": "Tuben" };
const plural = (u, n) => n === 1 ? u : (PL[u] || u);
function bQty(b, n) {
  const t = bTotal(b, n);
  if (Number(b.packSize) > 0) { const c = Math.ceil(t / Number(b.packSize) - 1e-9); return `${c} ${plural(b.packUnit || "Packung", c)}`; }
  const c = Math.ceil(t - 1e-9);
  return `${fmt(c)} ${plural(b.unit || "", c)}`.trim();
}
function bRule(b) {
  const a = fmt(Number(b.amount) || 0), u = b.unit || "";
  if (b.rule === "day") return `${a} ${u} pro Tag`.replace("  ", " ");
  if (b.rule === "week") return `${a} ${u} pro Woche`.replace("  ", " ");
  if (b.rule === "lasts") return `1 ${u || "Packung"} hält ${a} ${a === "1" ? "Tag" : "Tage"}`;
  return `${a} ${u} pro Einkauf`.replace("  ", " ");
}
const isBasic = name => { const n = lc(name); return S.basics.some(b => { const bn = lc(b.name).replace(/ light$/, ""); return bn && (n.includes(bn) || bn.includes(n)); }); };

/* ---------- Rezepte ---------- */
const SYN = { "hühnchen": ["hähnchen", "huhn", "chicken"], "hähnchen": ["hühnchen", "huhn", "chicken"], "huhn": ["hähnchen", "hühnchen", "chicken"], "chicken": ["hähnchen", "hühnchen"] };
function matchRecipe(r, q) {
  q = lc(q).trim(); if (!q) return true;
  const hay = [r.name, ...(r.tags || []), ...(r.ingredients || []).map(i => i.name)].map(lc).join(" | ");
  return q.split(/\s+/).every(w => [w, ...(SYN[w] || [])].some(v => hay.includes(v)));
}
const ingText = (i, f = 1) => i.amount == null || i.amount === "" ? (i.unit || "") : `${fmt(Number(i.amount) * f)} ${i.unit || ""}`.trim();
const recipe = id => S.recipes.find(r => r.id === id);
const mealName = k => { const p = S.plan[k]; if (!p) return null; if (p.recipeId) return recipe(p.recipeId)?.name || "Gelöschtes Rezept"; return p.text || null; };

/* ---------- Icons ---------- */
const IC = {
  start: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  kueche: '<path d="M5 9h14l-1.5 10a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"/><path d="M9 9l3-5 3 5"/>',
  kalender: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

async function generateList() {
  const sh = shopInfo(today()); if (!sh) return toast("Lege zuerst einen Einkaufstag fest.");
  const b = writeBatch(db);
  S.shopping.filter(i => (i.source === "basic" || i.source === "recipe") && !i.done).forEach(i => b.delete(D("shopping", i.id)));
  let n = 0, c = now();
  S.basics.slice().sort((a, x) => (a.order || 0) - (x.order || 0)).forEach(x => {
    if (x.have) { b.update(D("basics", x.id), { have: false }); return; }
    b.set(doc(C("shopping")), { name: x.name, store: "super", qty: bQty(x, sh.n), source: "basic", done: false, created: c + n++ });
  });
  for (let i = 0; i < sh.n; i++) {
    const k = add(sh.s, i); const p = S.plan[k]; const r = p?.recipeId && recipe(p.recipeId);
    if (!r) continue;
    (r.ingredients || []).forEach(g => b.set(doc(C("shopping")), { name: g.name, store: "super", qty: ingText(g), source: "recipe", note: `${r.name}, ${WD[dow(k)]}`, done: false, created: c + n++ }));
  }
  b.set(SETTINGS(), { lastGen: sh.s }, { merge: true });
  await b.commit();
  toast(`Einkaufsliste für ${short(sh.s)} erstellt`);
}
async function resizePhoto(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const max = 900; const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  let q = .75, out = cv.toDataURL("image/jpeg", q);
  while (out.length > 600000 && q > .35) { q -= .1; out = cv.toDataURL("image/jpeg", q); }
  return out;
}

const GOAL = 3;
const LISTS = [["dringend", "Dringend"], ["woche", "Diese Woche"], ["langzeit", "Langzeit"]];
const CATS = ["Arbeit", "Privat", "Haushalt", "Airbnb"];
const CATC = { Arbeit: ["var(--plum)", "var(--plumT)"], Privat: ["var(--green)", "var(--greenT)"], Haushalt: ["var(--anth)", "#E6E6E8"], Airbnb: ["var(--apriD)", "var(--apriT)"] };
const myTodos = () => S.todos.filter(x => x.owner === me());
const doneOn = k => myTodos().filter(x => x.done && x.doneAt && K(new Date(x.doneAt)) === k);
function streak() { let k = today(), n = 0; if (doneOn(k).length < GOAL) k = add(k, -1); while (doneOn(k).length >= GOAL && n < 400) { n++; k = add(k, -1); } return n; }
const openSorted = () => myTodos().filter(x => !x.done && x.list !== "langzeit").sort((a, b) => (a.list === "dringend" ? 0 : 1) - (b.list === "dringend" ? 0 : 1) || (a.due || "9").localeCompare(b.due || "9") || ((a.later || a.created || 0) - (b.later || b.created || 0)));
function vTodos() {
  const t = today(); const ws = weekStart(t); const open = openSorted(); const cur = open[0]; const next = open.slice(1, 6);
  const done = doneOn(t).sort((a, b) => a.doneAt - b.doneAt); const st = streak();
  const goals = myTodos().filter(x => x.list === "langzeit" && !x.done);
  const fromMe = S.todos.filter(x => x.from === me() && x.owner !== me()).sort((a, b) => (a.done - b.done) || (b.created - a.created)).slice(0, 8);
  const days = Array.from({ length: 7 }, (_, i) => add(ws, i));
  return `<div class="hero" style="background:var(--lilac);color:var(--tx)">

  <span style="font-size:12px;font-weight:700">Heute ${Math.min(done.length, GOAL)} von ${GOAL} fürs Tagesziel</span>

const sumOf = m => ["giro", "tagesgeld", "depot", "bar", "paypal", "partner"].reduce((s, k) => s + (Number(m[k]) || 0), 0);
const exR = m => sumOf(m) - ((Number(m.depot) || 0) - (Number(m.investiert) || 0));
const months = () => S.fin.slice().sort((a, b) => a.date.localeCompare(b.date));
const money = n => S.ui.hide ? "•••" : eur(n);
function lastFifteenth() { const t = today(); const d = P(t); const k = K(new Date(d.getFullYear(), d.getMonth(), 15)); return k <= t ? k : K(new Date(d.getFullYear(), d.getMonth() - 1, 15)); }
function partnerSuggestion(last) {
  if (!last) return null;
  const since = S.money.filter(e => e.date > last.date);
  return (Number(last.partner) || 0) + since.reduce((s, e) => s + (e.type === "in" ? -e.amount : hisShare(e)), 0);

function chart(ms, key) {

  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Vermögensverlauf"><polygon points="${pts[0][0].toFixed(1)},${H} ${line} ${last[0].toFixed(1)},${H}" fill="#E6E6E8"/><polyline points="${line}" fill="none" stroke="#4A4A50" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
